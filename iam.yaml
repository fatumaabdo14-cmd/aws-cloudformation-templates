AWSTemplateFormatVersion: '2010-09-09'
Description: IAM CloudFormation template

Resources:

  MyIAMUser:
    Type: AWS::IAM::User
    Properties:
      UserName: FatumaCFN2026
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  MyIAMGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: SoleyGroup

  UserToGroup:
    Type: AWS::IAM::UserToGroupAddition
    Properties:
      GroupName: !Ref MyIAMGroup
      Users:
        - !Ref MyIAMUser

  MyIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess

  MyIAMPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CustomPolicy

      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource: "*"

      Roles:
        - !Ref MyIAMRole


    

      

